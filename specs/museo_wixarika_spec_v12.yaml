release_notes_v12:
  base_version: "v11 (public/museo_wixarika_v11.glb - Curaduría manual en Blender preservada al 100%)"
  retained_intact:
    - "public/museo_wixarika_v11.glb (sin ninguna modificación)"
    - "Letreros superiores colgantes calibrados por el usuario"
    - "Cédulas y cuadros del pabellón de Fiestas y Ceremonias"
    - "Panteón de Deidades Sagradas, óculo de Tatewari y tapete central"
  enhancements_v12:
    - "Tipografía Monumental en Letreros de Gastronomía (v12.3):"
    - "  • Aumento radical de tamaño de fuente: hasta 230 pt para palabras únicas y 148-192 pt para títulos compuestos (más del doble de tamaño respecto a los 80-88 pt previos), abarcando entre el 87% y 90% del ancho del letrero."
    - "  • Formato de texto exclusivo: Eliminación absoluta de subtextos. 'MAÍZ TOSTADO' ahora muestra únicamente el nombre del platillo (se removió '(XARIKÍXA)'), cumpliendo la regla de que los letreros solo muestren el nombre de la comida."
    - "  • Preservación del tamaño de peana: Se mantuvieron intactas las dimensiones físicas aprobadas (0.66 m x 0.22 m x 0.06 m, quad 0.64 m x 0.20 m)."
    - "  • Relación de aspecto 3.2:1 exacta: Texturas generadas a 1536 x 480 px con tipografía Trebuchet Bold de alto contraste, sombra de relieve y factor emisivo para legibilidad máxima en VR."
    - "Corrección Integral de Altura e Inclinación de Letreros:"
    - "  • Corrección de penetración: Base de peanas colocada en Y = 0.895 m (completamente sobre el tablero de 0.885 m, sin atravesar la madera)."
    - "  • Corrección de inclinación: Ángulo invertido a -26° (orientado hacia arriba y al frente, vector normal con componente +Y apuntando directamente a la vista del observador VR a 1.60 m)."
    - "  • Separación visual: Alimentos en Z = -0.12 m y letreros en Z = +0.22 m (despeje de 34 cm para que ambos se aprecien simultáneamente)."
    - "Comida Tradicional con Alto Detalle y Texturas Fotorrealistas:"
    - "  • Tortillas de Maíz: Canasta de mimbre con paño bordado y disco de tortillas de comal tostadas con textura artesanal de nixtamal."
    - "  • Tamales: Bandeja rústica de madera noble con 4 tamales 3D envueltos en totomoxtle y lecho texturizado."
    - "  • Atole de Maíz: Gran olla vidriada nayarita apoyada sobre la mesa (sin atravesarla), cucharón de madera, jícaras y superficie espumosa."
    - "  • Caldo de Toro: Cazuela profunda de barro con asas y superficie horizontal texturizada de caldo ámbar con carne, chiles y cilantro."
    - "  • Maíz Tostado: Comal ceremonial de barro con lecho texturizado de granos tostados de 5 colores y granos en relieve."
    - "  • Perruri: Cuenco artesanal con textura de molienda dorada nupcial de maíz y pepitas de calabaza, más tacos tradicionales."
    - "  • Elotes Cocidos: Canasta de otate con mazorcas cocidas de elote tierno en la repisa central a nivel de ojos (Y = 1.63 m)."
    - "Arquitectura de Doble Mesa Curva de Gran Formato:"
    - "  • Dos mesas de 3.45m x 1.17m a R = 5.25m orientadas hacia el centro (0, 0, 0)."
    - "  • Mesa Norte: Tortillas, Tamales y Atole."
    - "  • Mesa Sur: Caldo de Toro, Maíz Tostado y Perruri."

