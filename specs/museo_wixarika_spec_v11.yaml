  enhancements_v11:
    - "Alineación y Micro-Ajuste Visual de Letreros Colgantes:"
    - "  • Bienvenida: Ajustado manualmente a [0.0688, 3.1558, 4.8061] para centrado estético respecto al dintel y pilar sur."
    - "  • Deidades: Ajustado a [0.0709, 3.1451, -4.7965] con leve rotación compensatoria frente al pilar norte."
    - "  • Fiestas: Elevado verticalmente a Y = 3.3035 m con reorientación precisa hacia el visitante central."
    - "  • Gastronomía: Reajuste micrométrico de posición y cadenas colgantes (Node_1168) centrado con la viga este."
    - "Rediseño y Proporciones de Cédulas en Fiestas:"
    - "  • Escala ampliada (~1.144x - 1.152x) y ajuste vertical en las bases de madera y cantera de las 3 placas."
    - "  • Eliminación de medallones esquineros en las placas inferiores para un acabado museográfico más limpio y moderno."

