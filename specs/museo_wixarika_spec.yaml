      section: "cuadrante_deidades"
      title_3d: "DEIDADES SAGRADAS"
      emblem_3d: "cabeza dorada de venado sagrado (Kauyumari) con astas ramificadas y disco solar"
      position: [0.0, 0.0, 4.4]
      orientation_deg: 180
    - id: "letrero_seccion_gastronomia"
      section: "cuadrante_gastronomia"
      title_3d: "GASTRONOMIA TRADICIONAL"
      emblem_3d: "mazorca sagrada dorada (Ikú) con hojas de totomoxtle y olla de barro"
      position: [4.8, 0.0, -1.6]
      orientation_deg: 110
    - id: "letrero_seccion_fiestas"
      section: "cuadrante_fiestas_patronales"
      title_3d: "FIESTAS Y CEREMONIAS"
      emblem_3d: "Ojo de Dios sagrado (Tsikuri) con plumas ceremoniales y tambor Tepu"
      position: [-4.8, 0.0, -1.6]
      orientation_deg: 250
    - id: "letrero_seccion_bienvenida"
      section: "cuadrante_bienvenida"
      title_3d: "BIENVENIDA CULTURAL"
      emblem_3d: "estrella sagrada de 8 puntas de Wirikuta con pórtico ceremonial"
      position: [0.0, 0.0, -5.2]
      orientation_deg: 0

budgets_and_dod:
  max_vertices: 45000
  max_triangles: 35000
  max_file_size_kb: 3000
  target_fps: 60
  mobile_hardware_tier: "Entry-to-Mid Android/iOS (Homido Grab VR Kiosk)"
  shading_model: "MeshStandardMaterial (PBR Stylized Quality Low-Poly)"
  export_format: ".glb (GLTF 2.0 Binary)"
  output_paths:
    - "public/museo_wixarika_base.glb"
    - "imagenesRef/museo_wixarika_base.glb"
