release_notes_v5:
  previous_versions_retained:
    - "v1: public/museo_wixarika_v1.glb y specs/museo_wixarika_spec_v1.yaml"
    - "v2: public/museo_wixarika_v2.glb y specs/museo_wixarika_spec_v2.yaml"
    - "v3: public/museo_wixarika_v3.glb y specs/museo_wixarika_spec_v3.yaml"
    - "v4: public/museo_wixarika_v4.glb y specs/museo_wixarika_spec_v4.yaml"
  enhancements_v5:
    - "Transformación total de la sección de Deidades Sagradas en una Galería de Arte Sacro Wixárika de gran formato, eliminando las esculturas/estatuillas 3D sobre pedestales para centrar toda la experiencia en los 6 cuadros sagrados enmarcados con relieve 3D fino."
    - "Eliminación completa del mural/paisaje invasor que se encontraba al centro de la pared norte (Z = -7.8m), dejando la curvatura del Kalihuey limpia y continua para una visibilidad panorámica perfecta."
    - "Ampliación de los 6 cuadros a gran formato (1.40m x 1.40m cuadrados y 1.50m x 1.00m horizontal para Haramara) enmarcados en madera de cedro con biseles de oro y esquineros ceremoniales de chaquira en rombo, coronados por luminarias museográficas Picture Light de latón dorado."
    - "Integración de las 6 obras fotográficas auténticas provistas por el usuario embebidas en el binario GLB (PNG y JPEG con soporte nativo GLTF 2.0):"
    - "  1. Tatewari ('Nuestro Abuelo, el Fuego') - Nierika auténtica de estambre con relieve 3D."
    - "  2. Tayau ('Nuestro Padre, el Sol') - Nierika sagrada solar con relieve de 24 rayos y rostro de oro."
    - "  3. Kauyumari ('El Venado Azul') - Nierika del venado azul sagrado con astas de oro y peyote."
    - "  4. Takutsi Nakawe ('Nuestra Bisabuela') - Nierika del diluvio primordial, árbol sagrado y canoa."
    - "  5. Tatei Niwetsika ('Nuestra Madre, el Maiz') - Nierika de la diosa del maíz de 4 colores y lluvia."
    - "  6. Tatei Haramara ('Nuestra Madre, el Mar') - Fotografía de la sagrada roca blanca en San Blas y olas con espuma marina."
    - "Diseño de placas informativas individuales de gran visibilidad (1.20m x 0.34m) con el Nombre Sagrado en letras doradas 3D de gran tamaño (size: 0.076) y el Significado Sagrado en subtítulo marfil de alta legibilidad (size: 0.038), optimizadas mediante mergeVertices."
    - "Ofrendas tradicionales al pie de cada cuadro a nivel de suelo (jícaras con semillas, conchas, copal y veladoras) sin obstruir la visual de los lienzos."
    - "Respeto íntegro a las curadurías de v4: suelo continuo sin plataforma y pasillos 100% despejados."

