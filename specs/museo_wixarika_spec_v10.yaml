  enhancements_v10:
    - "Inversión y Asignación Correcta de Cuadros en Fiestas:"
    - "  • Estación Central (Z = 0.00 m): Cuadro de arte con el título sagrado 'Tatei Neixa' + Cédula monumental TATEI NEIXA."
    - "  • Estación Norte/Derecha (Z = -1.85 m): Cuadro ceremonial tradicional de estambre con el tambor y cantador + Cédula monumental NAMAWITA NEIXA."
    - "  • Estación Sur/Izquierda (Z = +1.85 m): Nierika circular de peregrinación y danza + Cédula monumental HIKURI NEIXA."
    - "Centrado Exacto de los 4 Letreros Superiores respecto a los Pilares:"
    - "  • Corrección del desplazamiento hacia la izquierda en los 4 letreros colgantes de la sala:"
    - "    1. Bienvenida: pos = [-0.13, 3.15, 4.80], alineado al centro del pilar sur."
    - "    2. Gastronomía: pos = [4.80, 3.15, 0.13], alineado al centro del pilar este."
    - "    3. Deidades: pos = [0.13, 3.15, -4.80], alineado al centro del pilar norte."
    - "    4. Fiestas: pos = [-4.80, 3.15, -0.13], alineado al centro del pilar oeste."
    - "  • Orientación angular convergente al visitante central (0, 0, 0)."
    - "Elevación Vertical de Obras y Cédulas (Despeje Total de Mesas de Piso):"
    - "  • Cuadros a Y = 2.50 m (base del marco a Y = 1.60 m a nivel de ojos VR)."
    - "  • Cédulas a Y = 1.38 m (despejadas del tambor de 1.18 m y mesas de 0.85 m)."

