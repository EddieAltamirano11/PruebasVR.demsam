# Open Spec: Museo Virtual Wixárika (WebXR - Kiosco Cultural)
# Versión: 2.0.0 (v2)
# Proyecto: Módulo Inmersivo WebXR para la Difusión de las Culturas Vivas de Nayarit
# Sede: Biblioteca Pública Profesor Solón Argüello (Tepic, Nayarit)
# Equipo 10 - Taller Full Stack

spec_version: "2.0.0"
title: "Especificación Técnica y Cultural: Museo Virtual Wixárika 3D - Versión 2 (v2)"
status: "approved"
last_updated: "2026-10-18"

release_notes_v2:
  previous_version_retained: "v1 guardada en public/museo_wixarika_v1.glb y specs/museo_wixarika_spec_v1.yaml"
  enhancements:
    - "Sección de Deidades Sagradas enriquecida a nivel museográfico completo (v2)."
    - "Placas de identificación individual con relieve 3D en cada uno de los 6 pedestales."
    - "Conjunto de ofrendas tradicionales al pie de cada deidad (jícaras votivas, copal, semillas, caracoles, peyote)."
    - "Medallones y auras sagradas en 3D en el nicho de pared detrás de cada deidad."
    - "Pebeteros ceremoniales con copal y fuego sagrado flanqueando la plataforma de las deidades."
    - "Nodos de colisión e interactividad (hitboxes) preparados para raycasting en WebXR."

