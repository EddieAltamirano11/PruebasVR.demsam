# Open Spec: Museo Virtual Wixárika (WebXR - Kiosco Cultural)
# Versión: 4.0.0 (v4)
# Proyecto: Módulo Inmersivo WebXR para la Difusión de las Culturas Vivas de Nayarit
# Sede: Biblioteca Pública Profesor Solón Argüello (Tepic, Nayarit)
# Equipo 10 - Taller Full Stack

spec_version: "4.0.0"
title: "Especificación Técnica y Cultural: Museo Virtual Wixárika 3D - Versión 4 (v4)"
status: "approved"
last_updated: "2026-10-19"

release_notes_v4:
  previous_versions_retained:
    - "v1: public/museo_wixarika_v1.glb y specs/museo_wixarika_spec_v1.yaml"
    - "v2: public/museo_wixarika_v2.glb y specs/museo_wixarika_spec_v2.yaml"
    - "v3: public/museo_wixarika_v3.glb y specs/museo_wixarika_spec_v3.yaml"
  enhancements_and_curation_v4:
    - "Conservación íntegra de la obra sagrada auténtica de Tatewari (Nierika de estambre con textura PNG embebida en el binario GLB y relieve físico 3D de 134 componentes)."
    - "Eliminación definitiva de la plataforma/grada curva de las deidades (plataforma_alcoba_deidades): los 6 pedestales descansan directamente sobre la losa continua de cantera, mejorando la apertura espacial y accesibilidad visual."
    - "Eliminación definitiva de los pedestales/tótems de entrada con Ojos de Dios (pedestal_entrada_1 y pedestal_entrada_2) en el cuadrante de bienvenida: se despejan los accesos laterales hacia las deidades y se optimiza la circulación en VR."
    - "Optimización geométrica vía Blender (Khronos glTF Blender I/O v4.5.49): reducción de 40 mallas, 1,782 vértices y ~400 KB de peso binario."
    - "Mantenimiento estricto de letreros museográficos suspendidos en el techo a Y = 3.15m (DEIDADES SAGRADAS en Norte, BIENVENIDA CULTURAL en Sur, GASTRONOMÍA en Este, FIESTAS en Oeste)."

