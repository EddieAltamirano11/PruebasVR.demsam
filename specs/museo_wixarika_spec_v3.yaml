# Proyecto: Módulo Inmersivo WebXR para la Difusión de las Culturas Vivas de Nayarit
# Sede: Biblioteca Pública Profesor Solón Argüello (Tepic, Nayarit)
# Equipo 10 - Taller Full Stack

spec_version: "3.0.0"
title: "Especificación Técnica y Cultural: Museo Virtual Wixárika 3D - Versión 3 (v3)"
status: "approved"
last_updated: "2026-10-18"

release_notes_v3:
  previous_versions_retained:
    - "v1: public/museo_wixarika_v1.glb y specs/museo_wixarika_spec_v1.yaml"
    - "v2: public/museo_wixarika_v2.glb y specs/museo_wixarika_spec_v2.yaml"
  enhancements:
    - "Ambientación arquitectónica integral y fondo general con estética sagrada de la Cultura Wixárika (v3)."
    - "Cenefa perimetral ceremonial 360° con 32 rombos Tsikuri (Ojos de Dios) y grecas de estambre bajo la cornisa."
    - "8 Pilastras transformadas en Estelas Ceremoniales talladas con grabados sagrados y capiteles de turquesa."
    - "Techumbre ceremonial Kalihuey con 3 aros concéntricos de otate sagrado, roseta solar del óculo y 4 Tsikuris colgantes a los 4 puntos cardinales."
    - "Cosmograma sagrado en el piso central con los 4 rumbos del mundo Wixárika y senderos radiales de cantera y turquesa."
    - "Letreros museográficos suspendidos en el techo (Y = 3.15m) con varillas y anclajes, liberando 100% la visibilidad del suelo y contenidos expositivos."
    - "Inversión precisa de letreros: 'DEIDADES SAGRADAS' en Cuadrante Norte (Z = -4.8m frente a las 6 deidades) y 'BIENVENIDA CULTURAL' en Cuadrante Sur (Z = +4.8m, espacio para Menú 2D)."
    - "Cuadro Sagrado de Tatewari (Nierika de Estambre) en nicho de pared: sustitución por la obra fotográfica auténtica con textura PNG embebida en el binario GLB (357 KB) y modelado 3D de relieve físico fiel a la iconografía (Abuelo Fuego con rostro púrpura y cabellos de llama, Padre Sol Tayaupa, Águila Werika con relámpagos, Venado Sagrado Kauyumari, serpientes sagradas onduladas, cazador ceremonial con arco, árbol de peyote floreciente y rosetas de hikuri en la base)."

