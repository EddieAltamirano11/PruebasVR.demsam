  enhancements_v8:
    - "Instalación del Tapete Sagrado Wixárika (Mándala Ceremonial de Chaquira) en el círculo concéntrico del suelo: sustitución de las estrellas y rombos sobrepuestos por la obra auténtica de 1024x1024 embebida directamente en el binario GLB (tex_tapete_sagrado_wixarika)."
    - "El tapete cubre una superficie circular de 5.0 metros de diámetro (radio R = 2.50m) enmarcado por la moldura de madera oscura exterior y el anillo ceremonial de 48 cuentas de chaquira a R = 2.65m, integrándose limpiamente con los 4 senderos cardinales del cosmograma."
    - "Centrado perfecto de los letreros colgantes de techo en los cuadrantes de Gastronomía y Fiestas:"
    - "  • Letrero Gastronomía: Reubicado de [4.6, 3.15, -1.6] a [4.8, 3.15, 0.0] con rotación yaw de -90° (-PI/2), quedando perfectamente alineado al centro exacto de la mesa de exhibición de guisos/maíz y repisas."
    - "  • Letrero Fiestas Patronales: Reubicado de [-4.6, 3.15, -1.6] a [-4.8, 3.15, 0.0] con rotación yaw de +90° (+PI/2), quedando perfectamente alineado al centro exacto del gran tambor sagrado tepu y la nierika central."
    - "Los 4 letreros colgantes se encuentran ahora distribuidos de forma simétrica a R = 4.8m en cruz cardinal perfecta (Norte, Sur, Este y Oeste), mirando directamente hacia el visitante central."

