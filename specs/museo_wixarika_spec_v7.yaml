release_notes_v7:
  base_version: "v6 (public/museo_wixarika_v6.glb - Curaduría manual en Blender)"
  previous_versions_retained:
    - "v1: public/museo_wixarika_v1.glb y specs/museo_wixarika_spec_v1.yaml"
    - "v2: public/museo_wixarika_v2.glb y specs/museo_wixarika_spec_v2.yaml"
    - "v3: public/museo_wixarika_v3.glb y specs/museo_wixarika_spec_v3.yaml"
    - "v4: public/museo_wixarika_v4.glb y specs/museo_wixarika_spec_v4.yaml"
    - "v5: public/museo_wixarika_v5.glb y specs/museo_wixarika_spec_v5.yaml"
    - "v6: public/museo_wixarika_v6.glb (exportado desde Blender por el usuario)"
  enhancements_v7:
    - "Trabajo directo sobre la versión v6 de Blender sin alterar mallas, jerarquías, posiciones, rotaciones ni geometrías."
    - "Modificación exclusiva requerida: Cambio de color del material de las letras debajo del nombre de cada deidad (subtítulos con significado sagrado) de blanco/marfil a negro puro (#000000 / [0.0, 0.0, 0.0, 1.0])."
    - "Las 6 leyendas con tipografía negra 3D de alta legibilidad sobre placa de cantera:"
    - "  1. Tatewari -> 'Nuestro Abuelo, el Fuego'"
    - "  2. Tayau -> 'Nuestro Padre, el Sol'"
    - "  3. Kauyumari -> 'El Venado Azul'"
    - "  4. Takutsi Nakawe -> 'Nuestra Bisabuela'"
    - "  5. Tatei Niwetsika -> 'Nuestra Madre, el Maiz'"
    - "  6. Tatei Haramara -> 'Nuestra Madre, el Mar'"
    - "Preservación binaria exacta del buffer (BIN) de la exportación de Blender v6, garantizando 0% de distorsión en texturas o polígonos."

