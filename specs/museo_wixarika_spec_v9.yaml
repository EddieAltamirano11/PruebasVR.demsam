    - "v5: public/museo_wixarika_v5.glb y specs/museo_wixarika_spec_v5.yaml"
    - "v6: public/museo_wixarika_v6.glb (curaduría manual en Blender)"
    - "v7: public/museo_wixarika_v7.glb y specs/museo_wixarika_spec_v7.yaml"
    - "v8: public/museo_wixarika_v8.glb y specs/museo_wixarika_spec_v8.yaml"
  enhancements_v9:
    - "Instalación del Óculo Cenital Sagrado de Tatewari en el techo circular central (tragaluz/óculo a Y = 5.42 m)."
    - "Procesamiento de imagen de alta fidelidad: Remoción precisa y antialiased del fondo ajedrezado falso exterior, preservando al 100% el borde perimetral de chaquira blanca/negra y el disco sagrado de fuego (tatewari_oculo_techo.png en RGBA)."
    - "Alineación y orientación geométrica: El disco central del techo proyecta su normal hacia abajo (-Y), mirando directamente al visitante de pie sobre el tapete central."
    - "Orientación cosmogónica: La corona de fuego y cabeza de Tatewari apuntan al cuadrante Norte (muro de las deidades sagradas), creando coherencia visual y ritual en el eje vertical cielo-tierra (óculo Tatewari arriba <-> tapete mándala abajo)."
    - "Material PBR optimizado: mat_tatewari_oculo_techo configurado con alphaMode MASK (cutoff: 0.5), doubleSided: true, roughnessFactor: 0.65, metallicFactor: 0.05 para renderizado fiel y sin artefactos en WebXR móvil."
    - "Preservación estricta de todos los elementos anteriores: Mándala del suelo intacto, 4 letreros alineados cardinalmente en el techo, subtítulos en negro de deidades, cuadros agrandados e iluminación."

